  <!-- feet -->
  <ellipse cx="98" cy="184" rx="14" ry="9" fill="#FCEFD9"/>
  <ellipse cx="142" cy="184" rx="14" ry="9" fill="#FCEFD9"/>

  <!-- pestle, held in front of the body -->

<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <ellipse cx="120" cy="212" rx="70" ry="10" fill="#1B1B3A" opacity="0.15"/>

  <!-- mortar bowl -->

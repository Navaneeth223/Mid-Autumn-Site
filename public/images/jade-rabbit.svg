  <!-- blush -->
  <circle cx="96" cy="104" r="6" fill="#F2A9A0" opacity="0.7"/>
  <circle cx="144" cy="104" r="6" fill="#F2A9A0" opacity="0.7"/>

  <!-- face -->
  <ellipse cx="109" cy="94" rx="3.2" ry="4.4" fill="#3A2A1E"/>
  <ellipse cx="131" cy="94" rx="3.2" ry="4.4" fill="#3A2A1E"/>

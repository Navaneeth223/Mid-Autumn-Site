    </g>
    <g transform="translate(178,58) scale(0.75)">
      <ellipse rx="6" ry="9" fill="#F0C767" transform="rotate(10)"/>
      <ellipse rx="6" ry="9" fill="#F0C767" transform="rotate(82)"/>
      <ellipse rx="6" ry="9" fill="#F0C767" transform="rotate(154)"/>
      <ellipse rx="6" ry="9" fill="#F0C767" transform="rotate(226)"/>
      <ellipse rx="6" ry="9" fill="#F0C767" transform="rotate(298)"/>

    <g transform="translate(258,26) scale(0.7)">
      <ellipse rx="6" ry="9" fill="#F0C767" transform="rotate(20)"/>
      <ellipse rx="6" ry="9" fill="#F0C767" transform="rotate(92)"/>
      <ellipse rx="6" ry="9" fill="#F0C767" transform="rotate(164)"/>
      <ellipse rx="6" ry="9" fill="#F0C767" transform="rotate(236)"/>
      <ellipse rx="6" ry="9" fill="#F0C767" transform="rotate(308)"/>

  <!-- a few drifting loose petals, handy as standalone "falling petal" sprites too -->
  <ellipse cx="60" cy="60" rx="5" ry="7.5" fill="#E8B84B" opacity="0.85" transform="rotate(25 60 60)"/>
  <ellipse cx="40" cy="95" rx="4" ry="6" fill="#F0C767" opacity="0.7" transform="rotate(-10 40 95)"/>

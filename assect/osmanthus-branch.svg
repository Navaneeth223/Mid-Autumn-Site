    <g transform="translate(236,66) scale(0.65)">
      <ellipse rx="6" ry="9" fill="#E8B84B" transform="rotate(-15)"/>
      <ellipse rx="6" ry="9" fill="#E8B84B" transform="rotate(57)"/>
      <ellipse rx="6" ry="9" fill="#E8B84B" transform="rotate(129)"/>
      <ellipse rx="6" ry="9" fill="#E8B84B" transform="rotate(201)"/>
      <ellipse rx="6" ry="9" fill="#E8B84B" transform="rotate(273)"/>
